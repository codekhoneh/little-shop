{% load static %}

<!-- Product Card -->
							<div class="product-card bg-white">
								<div class="card-body p-4">
									<div class="actions d-flex justify-content-end gap-2">
										<div class="quick-view" data-bs-toggle="modal" data-bs-target="#quick_view_modal">
											<i class="ri-eye-fill"></i>
											<svg height="32" width="32">
												<circle class="circle" cx="16" cy="16" r="14" stroke="black" stroke-width="2" fill-opacity="0" />
											</svg>
										</div>
										<div class="add-to-card">
											<i class="ri-shopping-bag-fill"></i>
											<svg height="32" width="32">
												<circle class="circle" cx="16" cy="16" r="14" stroke="black" stroke-width="2" fill-opacity="0" />
											</svg>
										</div>
										<button class="wishlist wishlist-btn"
													data-product-id="{{ product.id }}"
													type="button">
											<i class="ri-heart-line"></i>
											</button>
									</div>
								<div class="card-image text-center"
										style="height:250px; display:flex; align-items:center; justify-content:center;">

										{% if product.image %}
											<img src="{{ product.image.url }}"
												alt="{{ product.title }}"
												class="img-fluid"
												style="max-height:220px; object-fit:contain;">
										{% endif %}

									</div>
									<div class="pt-4 text-center position-relative">
										<div class="card-label">
											<a href="product.html" class="link-dark text-decoration-none"><div class="card-title h5 text-capitalize">Fomex Men's Lace Up Shoes</div></a>
											<div class="card-price text-danger">$90.00</div>
										</div>
										<div class="card-desc text-muted small fw-light mt-3 text-truncate">Spotee presents you elegant and quality footwear for men.</div>
										<div class="card-review mt-1">
											<i class="ri-star-fill text-warning"></i>
											<i class="ri-star-fill text-warning"></i>
											<i class="ri-star-fill text-warning"></i>
											<i class="ri-star-fill text-warning"></i>
											<i class="ri-star-half-fill text-warning"></i>
										</div>
									</div>
								</div>
							</div>
							<!-- End Product Card -->
