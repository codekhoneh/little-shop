{% load static %}
<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta http-equiv="x-ua-compatible" content="ie=edge">
		
		<meta name="description" content="Little shopper is a clean and minimal HTML5 template for e-commerce websites.">
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<!-- Bootstrap -->
		<link rel="stylesheet" href='{% static "css/bootstrap.css" %}'>

		<!-- Main CSS Files -->
		<link rel="stylesheet" href='{% static "css/main.css" %}'>

		<!-- Custom CSS for Wishlist Button -->
		<style>
			button.wishlist-btn {
				background-color: inherit !important;
				border: 1px solid rgba(0,0,0,.5) !important;
				width: 30px !important;
				height: 30px !important;
				border-radius: 50% !important;
				display: inline-flex !important;
				align-items: center !important;
				justify-content: center !important;
				cursor: pointer !important;
				position: relative !important;
				padding: 0 !important;
				transition: all 300ms ease-out !important;
			}

			button.wishlist-btn:hover,
			button.wishlist-btn:focus {
				transform: scale(1.1) !important;
			}

			button.wishlist-btn:hover .circle,
			button.wishlist-btn:focus .circle {
				animation: stroke .6s ease-out forwards !important;
			}

			button.wishlist-btn svg {
				position: absolute !important;
			}

			button.wishlist-btn .circle {
				stroke-dasharray: 100 !important;
				stroke-dashoffset: 100 !important;
			}

			@keyframes stroke {
				to {
					stroke-dashoffset: 0 !important;
				}
			}
		</style>

		<!-- Font Icons (RemixIcons) -->
		<link rel="stylesheet" href='{% static "fonts/remixicon.css" %}'>
